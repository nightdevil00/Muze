# Fallback idle config, only used if hypridle is started by hand.
# Muze itself starts `hypridle -c ~/.config/muze/hypridle.conf`, generated by
# `muze-idle` from Settings -> Power. Edit the settings, not this file.
#
# `hyprctl dispatch` does not work with Hyprland 0.57's Lua config; use the
# muze-dpms / muze-repaint helpers instead.
general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = killall hyprlock; muze-repaint
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = muze-dpms on; muze-repaint
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = muze-dpms off
    on-resume = muze-dpms on
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
