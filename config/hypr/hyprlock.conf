# Generated by matugen from the current wallpaper. Do not edit by hand.
# Muze lock screen -- full config so no `source` directive is needed.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/beach.jpg
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 220, 50
    outline_thickness = 2
    rounding = 12
    inner_color = rgba(252b2dff)
    outer_color = rgba(84d2e7ff)
    check_color = rgba(bfc4ebff)
    fail_color = rgba(ffb4abff)
    font_color = rgba(dee3e5ff)
    placeholder_text = Password
    fade_on_empty = false
    dots_spacing = 0.4
    dots_size = 0.2
    dots_center = true
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 22
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
}
