# Used by muze-install for a fully offline install. The repository is bundled
# in the ISO at /var/cache/offline-repo (built by iso/build_iso.sh).
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 8
SigLevel    = Never
LocalFileSigLevel = Optional

[offline]
SigLevel = Never
Server = file:///var/cache/offline-repo/
